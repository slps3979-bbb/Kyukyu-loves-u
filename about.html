<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>團購點餐小助手</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .glass-panel {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
        }
    </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 pb-12">

    <!-- Navigation / Header -->
    <header class="bg-indigo-600 text-white shadow-md sticky top-0 z-30">
        <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <i class="fa-solid fa-utensils text-2xl text-amber-300"></i>
                <h1 class="text-xl md:text-2xl font-bold tracking-wide">團購點餐小助手</h1>
            </div>
            <button id="toggle-admin-btn" onclick="toggleAdminMode()" class="bg-indigo-700 hover:bg-indigo-800 text-white px-4 py-2 rounded-xl text-sm font-medium transition flex items-center gap-2 border border-indigo-500 shadow-sm">
                <i class="fa-solid fa-user-gear"></i>
                <span id="admin-btn-text">主揪後台</span>
            </button>
        </div>
    </header>

    <div class="max-w-6xl mx-auto px-4 py-6 space-y-6">

        <!-- Menu Image Section -->
        <section class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
            <div class="p-4 bg-slate-50 border-b border-slate-200 flex justify-between items-center">
                <h2 class="font-bold text-slate-700 flex items-center gap-2">
                    <i class="fa-regular fa-image text-indigo-500"></i> 店家菜單
                </h2>
                <!-- Host Upload Input (Admin Only) -->
                <div id="admin-upload-container" class="hidden">
                    <label class="cursor-pointer bg-indigo-50 hover:bg-indigo-100 text-indigo-600 border border-indigo-200 text-xs px-3 py-1.5 rounded-lg transition font-medium inline-flex items-center gap-1">
                        <i class="fa-solid fa-upload"></i> 上傳/更換菜單
                        <input type="file" id="menu-input" accept="image/*" class="hidden" onchange="handleMenuUpload(event)">
                    </label>
                </div>
            </div>
            
            <div class="p-4 flex flex-col items-center justify-center min-h-[160px] bg-slate-50/50">
                <div id="menu-display-area" class="w-full flex flex-col items-center">
                    <!-- Default state or uploaded image -->
                    <img id="menu-img" src="" alt="店家菜單" class="hidden max-h-80 object-contain rounded-lg shadow-sm border cursor-pointer hover:opacity-95 transition" onclick="openImageModal()">
                    <div id="no-menu-placeholder" class="text-center py-8 text-slate-400">
                        <i class="fa-solid fa-file-image text-4xl mb-2 text-slate-300"></i>
                        <p class="text-sm">主揪尚未上傳菜單圖片</p>
                    </div>
                </div>
                <p id="menu-hint" class="hidden text-xs text-slate-400 mt-2"><i class="fa-solid fa-magnifying-glass-plus mr-1"></i>點擊圖片可放大檢視</p>
            </div>
        </section>

        <!-- Main Layout: Left Form, Right List -->
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">

            <!-- User Order Input Form -->
            <section class="lg:col-span-5 bg-white p-5 rounded-2xl shadow-sm border border-slate-200 h-fit">
                <h2 class="text-lg font-bold text-slate-800 mb-4 pb-2 border-b border-slate-100 flex items-center gap-2">
                    <i class="fa-solid fa-pen-to-square text-indigo-500"></i> 新增點餐品項
                </h2>
                <form id="order-form" onsubmit="handleOrderSubmit(event)" class="space-y-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">您的姓名 / 暱稱 <span class="text-red-500">*</span></label>
                        <input type="text" id="user-name" required placeholder="例：小明" class="w-full px-3 py-2 border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none text-sm transition">
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">飲料/餐點名稱 <span class="text-red-500">*</span></label>
                        <input type="text" id="item-name" required placeholder="例：珍珠奶茶" class="w-full px-3 py-2 border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none text-sm transition">
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">甜度</label>
                            <select id="sweetness" class="w-full px-3 py-2 border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none text-sm bg-white transition">
                                <option value="正常糖">正常糖</option>
                                <option value="少糖">少糖 (7分)</option>
                                <option value="半糖">半糖 (5分)</option>
                                <option value="微糖" selected>微糖 (3分)</option>
                                <option value="無糖">無糖 (0分)</option>
                                <option value="不適用">不適用 (餐點)</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">冰塊</label>
                            <select id="ice-level" class="w-full px-3 py-2 border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none text-sm bg-white transition">
                                <option value="正常冰">正常冰</option>
                                <option value="少冰">少冰</option>
                                <option value="微冰" selected>微冰</option>
                                <option value="去冰">去冰</option>
                                <option value="熱">熱</option>
                                <option value="不適用">不適用 (餐點)</option>
                            </select>
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">備註 (如：加珍珠、不加蔥...)</label>
                        <input type="text" id="item-note" placeholder="選填" class="w-full px-3 py-2 border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none text-sm transition">
                    </div>

                    <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 active:bg-indigo-800 text-white font-medium py-2.5 rounded-xl transition shadow-md flex items-center justify-center gap-2 text-sm mt-2">
                        <i class="fa-solid fa-plus"></i> 送出點餐
                    </button>
                </form>
            </section>

            <!-- Live Orders Feed -->
            <section class="lg:col-span-7 bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
                <div class="flex justify-between items-center mb-4 pb-2 border-b border-slate-100">
                    <h2 class="text-lg font-bold text-slate-800 flex items-center gap-2">
                        <i class="fa-solid fa-list-check text-indigo-500"></i> 即時點餐動態
                    </h2>
                    <span id="order-count-badge" class="bg-indigo-50 text-indigo-600 text-xs font-semibold px-2.5 py-1 rounded-full border border-indigo-100">
                        共 0 份
                    </span>
                </div>

                <!-- Orders Container -->
                <div id="orders-feed" class="space-y-3 max-h-[500px] overflow-y-auto pr-1">
                    <!-- Dynamic rendering of order cards -->
                </div>
            </section>
        </div>

        <!-- Admin Dashboard Section (Collapsible/Hidden by default) -->
        <section id="admin-panel" class="hidden bg-slate-900 text-white p-6 rounded-2xl shadow-xl space-y-6 mt-8 border border-slate-800">
            <div class="flex flex-wrap justify-between items-center pb-4 border-b border-slate-800 gap-4">
                <div>
                    <h2 class="text-xl font-bold text-amber-400 flex items-center gap-2">
                        <i class="fa-solid fa-shield-halved"></i> 主揪後台管理區
                    </h2>
                    <p class="text-xs text-slate-400 mt-1">即時統計訂單總數，方便直接向店家報單或匯出 Excel 資料</p>
                </div>
                <div class="flex flex-wrap gap-2">
                    <button onclick="copySummaryText()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-1.5 rounded-lg text-xs font-medium transition flex items-center gap-1.5">
                        <i class="fa-regular fa-copy"></i> 複製店家統計清單
                    </button>
                    <button onclick="exportCSV()" class="bg-blue-600 hover:bg-blue-700 text-white px-3 py-1.5 rounded-lg text-xs font-medium transition flex items-center gap-1.5">
                        <i class="fa-solid fa-file-csv"></i> 下載 CSV 表格
                    </button>
                    <button onclick="clearAllOrders()" class="bg-rose-600 hover:bg-rose-700 text-white px-3 py-1.5 rounded-lg text-xs font-medium transition flex items-center gap-1.5">
                        <i class="fa-solid fa-trash-can"></i> 清空所有點餐
                    </button>
                </div>
            </div>

            <!-- Summary Table -->
            <div>
                <h3 class="text-sm font-semibold text-slate-300 mb-3 flex items-center gap-2">
                    <i class="fa-solid fa-calculator text-indigo-400"></i> 品項數量總計 (向店家報價)
                </h3>
                <div class="bg-slate-800 rounded-xl p-4 overflow-x-auto border border-slate-700">
                    <table class="w-full text-left text-xs text-slate-300">
                        <thead>
                            <tr class="border-b border-slate-700 text-slate-400">
                                <th class="pb-2">品項與規格 (品項 / 甜度 / 冰塊)</th>
                                <th class="pb-2 text-right">總數量</th>
                                <th class="pb-2 text-right">點餐訂購人</th>
                            </tr>
                        </thead>
                        <tbody id="summary-table-body" class="divide-y divide-slate-700/50">
                            <!-- Summary dynamic content -->
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Detail Table -->
            <div>
                <h3 class="text-sm font-semibold text-slate-300 mb-3 flex items-center gap-2">
                    <i class="fa-solid fa-table-list text-indigo-400"></i> 所有人點餐明細
                </h3>
                <div class="bg-slate-800 rounded-xl overflow-x-auto border border-slate-700">
                    <table class="w-full text-left text-xs text-slate-300">
                        <thead class="bg-slate-800/80 text-slate-400 border-b border-slate-700">
                            <tr>
                                <th class="p-3">姓名</th>
                                <th class="p-3">品項</th>
                                <th class="p-3">甜度</th>
                                <th class="p-3">冰塊</th>
                                <th class="p-3">備註</th>
                                <th class="p-3 text-center">操作</th>
                            </tr>
                        </thead>
                        <tbody id="admin-detail-table-body" class="divide-y divide-slate-700/50">
                            <!-- Detail dynamic content -->
                        </tbody>
                    </table>
                </div>
            </div>
        </section>

    </div>

    <!-- Image Modal for Menu Zooming -->
    <div id="image-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4" onclick="closeImageModal()">
        <div class="relative max-w-4xl max-h-[90vh] w-full flex items-center justify-center">
            <img id="modal-img" src="" class="max-h-[85vh] max-w-full object-contain rounded-lg shadow-2xl">
            <button onclick="closeImageModal()" class="absolute -top-10 right-0 text-white hover:text-amber-400 text-xl font-bold bg-black/50 px-3 py-1 rounded-full">
                <i class="fa-solid fa-xmark"></i> 關閉
            </button>
        </div>
    </div>

    <!-- Message Toast -->
    <div id="toast" class="fixed bottom-5 right-5 bg-slate-800 text-white px-4 py-3 rounded-xl shadow-xl transition transform translate-y-20 opacity-0 z-50 text-sm flex items-center gap-2 border border-slate-700">
        <i id="toast-icon" class="fa-solid fa-circle-check text-emerald-400"></i>
        <span id="toast-msg">提示訊息</span>
    </div>

    <script>
        // Data State
        let orders = [];
        let isAdmin = false;
        let menuImageData = '';

        // Initialize on Load
        window.onload = function() {
            loadStorageData();
            renderUI();
        };

        // Load data from LocalStorage
        function loadStorageData() {
            const savedOrders = localStorage.getItem('group_orders_data');
            if (savedOrders) {
                try { orders = JSON.parse(savedOrders); } catch(e) { orders = []; }
            }
            const savedMenu = localStorage.getItem('group_orders_menu');
            if (savedMenu) {
                menuImageData = savedMenu;
            }
        }

        // Save data to LocalStorage
        function saveData() {
            localStorage.setItem('group_orders_data', JSON.stringify(orders));
        }

        // Menu Upload Handling
        function handleMenuUpload(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    menuImageData = e.target.result;
                    localStorage.setItem('group_orders_menu', menuImageData);
                    renderMenu();
                    showToast('菜單圖片已成功上傳！');
                };
                reader.readAsDataURL(file);
            }
        }

        function renderMenu() {
            const imgEl = document.getElementById('menu-img');
            const placeholderEl = document.getElementById('no-menu-placeholder');
            const hintEl = document.getElementById('menu-hint');

            if (menuImageData) {
                imgEl.src = menuImageData;
                imgEl.classList.remove('hidden');
                placeholderEl.classList.add('hidden');
                hintEl.classList.remove('hidden');
            } else {
                imgEl.classList.add('hidden');
                placeholderEl.classList.remove('hidden');
                hintEl.classList.add('hidden');
            }
        }

        function openImageModal() {
            if (menuImageData) {
                document.getElementById('modal-img').src = menuImageData;
                document.getElementById('image-modal').classList.remove('hidden');
            }
        }

        function closeImageModal() {
            document.getElementById('image-modal').classList.add('hidden');
        }

        // Order Submission
        function handleOrderSubmit(e) {
            e.preventDefault();
            const name = document.getElementById('user-name').value.trim();
            const item = document.getElementById('item-name').value.trim();
            const sweetness = document.getElementById('sweetness').value;
            const ice = document.getElementById('ice-level').value;
            const note = document.getElementById('item-note').value.trim();

            if (!name || !item) return;

            const newOrder = {
                id: Date.now(),
                name,
                item,
                sweetness,
                ice,
                note,
                time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
            };

            orders.unshift(newOrder); // Add to beginning
            saveData();
            renderUI();

            // Clear item input, keep name for convenience
            document.getElementById('item-name').value = '';
            document.getElementById('item-note').value = '';
            showToast('已成功加入點餐清單！');
        }

        // Delete Single Order
        function deleteOrder(id) {
            orders = orders.filter(o => o.id !== id);
            saveData();
            renderUI();
            showToast('已刪除點餐項目');
        }

        // Render UI
        function renderUI() {
            renderMenu();
            renderOrdersFeed();
            renderSummaryTable();
            renderAdminDetailTable();
            
            // Toggle admin upload visibility
            const adminUpload = document.getElementById('admin-upload-container');
            if (isAdmin) {
                adminUpload.classList.remove('hidden');
            } else {
                adminUpload.classList.add('hidden');
            }
        }

        // Render Live Feed
        function renderOrdersFeed() {
            const container = document.getElementById('orders-feed');
            const countBadge = document.getElementById('order-count-badge');
            countBadge.textContent = `共 ${orders.length} 份`;

            if (orders.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-10 text-slate-400">
                        <i class="fa-solid fa-basket-shopping text-3xl mb-2 text-slate-300"></i>
                        <p class="text-sm">目前尚無人點餐，快填寫左側表單吧！</p>
                    </div>`;
                return;
            }

            container.innerHTML = orders.map(o => `
                <div class="p-3.5 bg-slate-50 hover:bg-indigo-50/40 rounded-xl border border-slate-200/80 transition flex justify-between items-start group">
                    <div class="space-y-1">
                        <div class="flex items-center gap-2">
                            <span class="font-bold text-slate-800 text-sm">${escapeHtml(o.name)}</span>
                            <span class="text-[10px] text-slate-400 bg-slate-200/60 px-1.5 py-0.5 rounded">${o.time}</span>
                        </div>
                        <div class="text-indigo-600 font-semibold text-sm">
                            ${escapeHtml(o.item)}
                        </div>
                        <div class="flex flex-wrap items-center gap-1.5 text-xs text-slate-500">
                            ${o.sweetness !== '不適用' ? `<span class="bg-amber-100 text-amber-800 px-2 py-0.5 rounded-md font-medium text-[11px]">${o.sweetness}</span>` : ''}
                            ${o.ice !== '不適用' ? `<span class="bg-blue-100 text-blue-800 px-2 py-0.5 rounded-md font-medium text-[11px]">${o.ice}</span>` : ''}
                            ${o.note ? `<span class="text-slate-400 italic">備註: ${escapeHtml(o.note)}</span>` : ''}
                        </div>
                    </div>
                    ${isAdmin ? `
                        <button onclick="deleteOrder(${o.id})" class="text-slate-300 hover:text-rose-500 p-1 transition" title="刪除">
                            <i class="fa-solid fa-trash"></i>
                        </button>
                    ` : ''}
                </div>
            `).join('');
        }

        // Render Admin Summary Table
        function renderSummaryTable() {
            const tbody = document.getElementById('summary-table-body');
            if (orders.length === 0) {
                tbody.innerHTML = `<tr><td colspan="3" class="text-center py-4 text-slate-500">無點餐資料</td></tr>`;
                return;
            }

            // Group by Item + Sweetness + Ice
            const summaryMap = {};
            orders.forEach(o => {
                const spec = `${o.item} (${o.sweetness}/${o.ice})`;
                if (!summaryMap[spec]) {
                    summaryMap[spec] = { count: 0, names: [] };
                }
                summaryMap[spec].count += 1;
                summaryMap[spec].names.push(o.name);
            });

            tbody.innerHTML = Object.keys(summaryMap).map(key => `
                <tr class="hover:bg-slate-700/30">
                    <td class="py-2.5 font-medium text-slate-200">${escapeHtml(key)}</td>
                    <td class="py-2.5 text-right font-bold text-amber-400 text-sm">x${summaryMap[key].count}</td>
                    <td class="py-2.5 text-right text-slate-400 text-[11px] max-w-[150px] truncate">${escapeHtml(summaryMap[key].names.join(', '))}</td>
                </tr>
            `).join('');
        }

        // Render Admin Detail Table
        function renderAdminDetailTable() {
            const tbody = document.getElementById('admin-detail-table-body');
            if (orders.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="text-center py-4 text-slate-500">無點餐明細</td></tr>`;
                return;
            }

            tbody.innerHTML = orders.map(o => `
                <tr class="hover:bg-slate-700/30">
                    <td class="p-3 font-medium text-slate-200">${escapeHtml(o.name)}</td>
                    <td class="p-3 text-indigo-300 font-medium">${escapeHtml(o.item)}</td>
                    <td class="p-3 text-slate-300">${o.sweetness}</td>
                    <td class="p-3 text-slate-300">${o.ice}</td>
                    <td class="p-3 text-slate-400">${escapeHtml(o.note || '-')}</td>
                    <td class="p-3 text-center">
                        <button onclick="deleteOrder(${o.id})" class="text-rose-400 hover:text-rose-300 p-1">
                            <i class="fa-solid fa-trash"></i>
                        </button>
                    </td>
                </tr>
            `).join('');
        }

        // Toggle Admin Mode
        function toggleAdminMode() {
            isAdmin = !isAdmin;
            const adminPanel = document.getElementById('admin-panel');
            const adminBtnText = document.getElementById('admin-btn-text');

            if (isAdmin) {
                adminPanel.classList.remove('hidden');
                adminBtnText.textContent = '關閉後台';
                showToast('已切換至【主揪後台模式】');
            } else {
                adminPanel.classList.add('hidden');
                adminBtnText.textContent = '主揪後台';
            }
            renderUI();
        }

        // Copy Text Summary for Store
        function copySummaryText() {
            if (orders.length === 0) {
                showToast('目前無訂單可複製');
                return;
            }

            const summaryMap = {};
            orders.forEach(o => {
                const spec = `${o.item} (${o.sweetness}/${o.ice})`;
                summaryMap[spec] = (summaryMap[spec] || 0) + 1;
            });

            let text = `【團購點餐統計】(總計: ${orders.length} 份)\n------------------\n`;
            for (let spec in summaryMap) {
                text += `${spec} x ${summaryMap[spec]}\n`;
            }

            // Copy via execCommand for iFrame compatibility
            const textarea = document.createElement('textarea');
            textarea.value = text;
            document.body.appendChild(textarea);
            textarea.select();
            document.execCommand('copy');
            document.body.removeChild(textarea);

            showToast('點餐統計已複製到剪貼簿！');
        }

        // Export to CSV
        function exportCSV() {
            if (orders.length === 0) {
                showToast('無資料可匯出');
                return;
            }

            let csvContent = "data:text/csv;charset=utf-8,\uFEFF"; // Add UTF-8 BOM for Excel
            csvContent += "姓名,品項,甜度,冰塊,備註,點餐時間\n";

            orders.forEach(o => {
                const row = [
                    `"${o.name}"`,
                    `"${o.item}"`,
                    `"${o.sweetness}"`,
                    `"${o.ice}"`,
                    `"${o.note || ''}"`,
                    `"${o.time}"`
                ].join(",");
                csvContent += row + "\n";
            });

            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", `團購點餐明細_${new Date().toISOString().slice(0,10)}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);

            showToast('CSV 檔案已開始下載！');
        }

        // Clear All Orders
        function clearAllOrders() {
            if (confirm('確定要清空所有點餐紀錄嗎？此動作無法復原。')) {
                orders = [];
                saveData();
                renderUI();
                showToast('已清空所有點餐紀錄');
            }
        }

        // Toast Helper
        function showToast(msg) {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toast-msg');
            toastMsg.textContent = msg;
            toast.classList.remove('translate-y-20', 'opacity-0');
            setTimeout(() => {
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 3000);
        }

        // HTML Escape Helper
        function escapeHtml(str) {
            return str.replace(/[&<>"']/g, function(m) {
                return {
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    '"': '&quot;',
                    "'": '&#039;'
                }[m];
            });
        }
    </script>
</body>
